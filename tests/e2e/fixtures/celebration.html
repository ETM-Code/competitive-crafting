<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <link rel="stylesheet" href="/src/styles/game.css" />
    <link rel="stylesheet" href="/src/styles/mobile.css" />
    <link rel="stylesheet" href="/src/styles/screens.css" />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      #root {
        padding: 16px;
        box-sizing: border-box;
        background: #24382b;
      }
      .fixture-root {
        height: 100%;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-fixture-clock></div>
    <script type="module">
      import React from 'react';
      import ReactDOM from 'react-dom/client';
      import { RoundSummary } from '/src/components/RoundSummary.tsx';
      import { Results } from '/src/components/Results.tsx';
      import { solutionFor } from '/src/shared/recipes.ts';
      import { DEFAULT_SETTINGS, REVEAL_MS } from '/src/shared/rules.ts';
      import { playerRanks } from '/src/components/Scoreboard.tsx';

      const names = [
        'BirchBuilder',
        'RedstoneRider',
        'CreeperKeeper',
        'CopperCrafter',
        'DiamondDreamer',
        'IronExplorer',
        'LongPlayerNameTwenty',
        'VillageKeeper',
        'BlockBreaker',
        'QuartzQuester',
        'WoolWizard',
        'StoneSeeker',
      ];
      const avatars = ['creeper', 'pig', 'ender_dragon', 'wither', 'zombie', 'iron_golem'];
      const before = names.map((name, i) => ({
        id: 'p' + i,
        name,
        avatar: avatars[i % 6],
        score: 500 - i * 30,
        wins: 1,
        winningTime: 10000 + i * 100,
        connected: true,
        ready: true,
        spectator: false,
      }));
      const players = before.map((p, i) => ({ ...p, score: p.score + (i === 4 ? 300 : 0) }));
      const ranksBefore = playerRanks(before),
        ranksAfter = playerRanks(players);
      const standings = players.map((p, i) => ({
        playerId: p.id,
        name: p.name,
        avatar: p.avatar,
        scoreBefore: before[i].score,
        scoreAfter: p.score,
        points: i === 4 ? 300 : 0,
        rankBefore: ranksBefore.get(p.id),
        rankAfter: ranksAfter.get(p.id),
        status: i === 4 ? 'crafted' : i === 2 ? 'forfeited' : 'timeout',
      }));
      const initial = {
        code: 'ABC123',
        hostId: 'p4',
        phase: new URL(location.href).searchParams.get('scene') ?? 'reveal',
        settings: DEFAULT_SETTINGS,
        players,
        deadline: REVEAL_MS,
        serverNow: 0,
        revision: 1,
        practice: false,
        history: [
          { target: 'crafter', winnerId: 'p4', points: 300, endReason: 'crafted', standings },
        ],
        round: {
          id: 'r1',
          index: 6,
          target: 'crafter',
          tier: 5,
          points: 300,
          palette: [],
          startsAt: -30000,
          endsAt: 0,
          finishers: [{ playerId: 'p4', points: 300, elapsed: 9200 }],
          playerStates: {},
          endReason: 'crafted',
          standings,
          solution: solutionFor('crafter'),
        },
      };
      function App() {
        const [room, setRoom] = React.useState(initial);
        const [now, setNow] = React.useState(0);
        const [connected, setConnected] = React.useState(true);
        window.setConnected = setConnected;
        window.setFixture = setRoom;
        window.setFixtureTime = setNow;
        const session = { code: 'ABC123', playerId: 'p4', token: 'fixture' };
        return React.createElement(
          'div',
          { className: 'fixture-root' },
          room.phase === 'reveal'
            ? React.createElement(RoundSummary, {
                room,
                session,
                now,
                connected,
                onOpenMenu: () => {},
                onSkipReveal: () => {
                  window.skipCalls = (window.skipCalls || 0) + 1;
                  return true;
                },
              })
            : React.createElement(Results, {
                room,
                session,
                connected: true,
                send: () => true,
                onLeave: () => {},
              }),
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
      window.initialFixture = initial;
    </script>
  </body>
</html>
