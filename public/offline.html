<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#202725" />
    <title>Competitive Crafting</title>
    <style>
      body {
        margin: 0;
        background: #202725;
        color: #f2eddc;
        font:
          17px/1.6 system-ui,
          sans-serif;
        min-height: 100svh;
        box-sizing: border-box;
        padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px))
          env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));
        display: grid;
        place-items: center;
      }
      main {
        max-width: 34rem;
        padding: 32px;
      }
      h1 {
        font-size: 28px;
      }
      a {
        display: inline-block;
        padding: 12px 24px;
        background: #86b94b;
        border: 3px outset #a7cc74;
        color: #15200f;
        text-decoration: none;
        font-weight: 700;
      }
      a:focus-visible {
        outline: 3px solid #f2eddc;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Waiting for a connection</h1>
      <p>
        Your crafting table will be here when you get back online. Multiplayer and practice need a
        connection to keep the clock and scores fair.
      </p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
